<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CyberSense{% endblock %}</title>
  <link rel="icon" href="/static/img/logo.svg">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><img src="/static/img/logo.svg" alt="CyberSense logo">CyberSense</a>
      <nav class="nav">
        <a href="/" {% if active == 'home' %}class="active"{% endif %}>Home</a>
        <a href="/exercises" {% if active == 'exercises' %}class="active"{% endif %}>Exercises</a>
        <a href="/progress" {% if active == 'progress' %}class="active"{% endif %}>My Progress</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    CyberSense &middot; University project prototype &middot;
    All companies, people and scenarios are fictional training examples.
  </footer>

  <script src="/static/js/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
